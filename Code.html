<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventaire Code Barre</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    text-align:center;
    margin:20px;
}

#reader{
    width:320px;
    margin:auto;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.btn-primary{
    background:#0d6efd;
    color:white;
}

.btn-success{
    background:#198754;
    color:white;
}

.btn-danger{
    background:#dc3545;
    color:white;
}

table{
    width:95%;
    margin:auto;
    margin-top:20px;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
}

th{
    background:#0d6efd;
    color:white;
}

#productPreview{
    display:none;
    width:400px;
    margin:20px auto;
    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 0 10px rgba(0,0,0,0.15);
}

#message{
    font-size:20px;
    font-weight:bold;
    color:green;
    margin:15px;
}

</style>

</head>

<body>

<h2>Inventaire Code Barre</h2>

<div id="reader"></div>

<div id="message"></div>

<div id="productPreview">

    <h3>Produit détecté</h3>

    <p>
        <strong>Code :</strong>
        <span id="previewCode"></span>
    </p>

    <p>
        <strong>Nom :</strong>
        <span id="previewName"></span>
    </p>

    <p>
        <strong>Référence :</strong>
        <span id="previewRef"></span>
    </p>

    <button class="btn-success" onclick="confirmScan()">
        ✅ Confirmer
    </button>

    <button class="btn-danger" onclick="cancelScan()">
        ❌ Annuler
    </button>

</div>

<div>

    <button class="btn-primary" onclick="exportCSV()">
        Export CSV
    </button>

    <button class="btn-danger" onclick="clearData()">
        Vider les données
    </button>

    <button class="btn-primary" onclick="switchCamera()">
        Changer caméra
    </button>

</div>

<table>

<thead>
<tr>
    <th>Code Barre</th>
    <th>Produit</th>
    <th>Quantité</th>
    <th>Dernier Scan</th>
</tr>
</thead>

<tbody id="dataTable"></tbody>

</table>

<script>

// =====================================================
// BASE PRODUITS
// =====================================================

const productsDB = {

    "01037602466004151126032817310228102603N0402": {
        name: "Clavier Logitech K120",
        reference: "LOG-K120"
    },

    "353497": {
        name: "Courrier Free Pro",
        reference: "Courrier de Reception"
    },

    "8004260494472": {
        name: "Boite de Mouhcoir",
        reference: "Le Trèfle"
    }

};

// =====================================================
// VARIABLES
// =====================================================

let scans =
    JSON.parse(
        localStorage.getItem("barcode_scans")
    ) || [];

let pendingScan = null;

let html5QrCode =
    new Html5Qrcode("reader");

let cameras = [];

let currentCameraIndex = 0;

let lastScanTime = 0;

const tableBody =
    document.getElementById("dataTable");

const messageDiv =
    document.getElementById("message");

// =====================================================
// TABLEAU
// =====================================================

function renderTable(){

    tableBody.innerHTML = "";

    scans.forEach(scan => {

        const tr =
            document.createElement("tr");

        tr.innerHTML = `
            <td>${scan.code}</td>
            <td>${scan.name}</td>
            <td>${scan.quantity}</td>
            <td>${scan.lastScan}</td>
        `;

        tableBody.appendChild(tr);

    });

}

renderTable();

// =====================================================
// MESSAGE
// =====================================================

function showMessage(text,color="green"){

    messageDiv.style.color = color;
    messageDiv.innerText = text;

    setTimeout(()=>{
        messageDiv.innerText = "";
    },1500);

}

// =====================================================
// SCAN
// =====================================================

function onScanSuccess(decodedText){

    const nowTime = Date.now();

    if(nowTime - lastScanTime < 1000){
        return;
    }

    lastScanTime = nowTime;

    const product =
        productsDB[decodedText];

    pendingScan = {

        code: decodedText,

        product: product || {

            name: "Produit inconnu",
            reference: "-"

        }

    };

    document.getElementById(
        "previewCode"
    ).innerText = pendingScan.code;

    document.getElementById(
        "previewName"
    ).innerText = pendingScan.product.name;

    document.getElementById(
        "previewRef"
    ).innerText = pendingScan.product.reference;

    document.getElementById(
        "productPreview"
    ).style.display = "block";

}

// =====================================================
// CONFIRMATION
// =====================================================

function confirmScan(){

    if(!pendingScan) return;

    const now =
        new Date().toLocaleString();

    let existing =
        scans.find(
            item => item.code === pendingScan.code
        );

    if(existing){

        existing.quantity++;

        existing.lastScan = now;

    }
    else{

        scans.push({

            code: pendingScan.code,

            name: pendingScan.product.name,

            quantity: 1,

            lastScan: now

        });

    }

    localStorage.setItem(
        "barcode_scans",
        JSON.stringify(scans)
    );

    renderTable();

    document.getElementById(
        "productPreview"
    ).style.display = "none";

    pendingScan = null;

    if(navigator.vibrate){
        navigator.vibrate(100);
    }

    showMessage("✔ Produit enregistré");

}

// =====================================================
// ANNULATION
// =====================================================

function cancelScan(){

    pendingScan = null;

    document.getElementById(
        "productPreview"
    ).style.display = "none";

    showMessage(
        "❌ Scan annulé",
        "red"
    );

}

// =====================================================
// SCANNER
// =====================================================

function startScanner(cameraConfig){

    html5QrCode.start(

        cameraConfig,

        {
            fps:15,
            qrbox:{
                width:200,
                height:120
            }
        },

        onScanSuccess

    ).catch(err=>{

        console.error(err);

    });

}

// =====================================================
// CAMERAS
// =====================================================

Html5Qrcode.getCameras()

.then(devices=>{

    if(!devices.length){

        alert(
            "Aucune caméra détectée"
        );

        return;

    }

    cameras = devices;

    startScanner({
        facingMode:"environment"
    });

})

.catch(err=>{

    console.error(err);

});

// =====================================================
// CHANGER CAMERA
// =====================================================

function switchCamera(){

    if(!cameras.length) return;

    html5QrCode.stop()

    .then(()=>{

        currentCameraIndex++;

        if(
            currentCameraIndex >=
            cameras.length
        ){
            currentCameraIndex = 0;
        }

        startScanner(
            cameras[currentCameraIndex].id
        );

        showMessage("📷 Caméra changée");

    })

    .catch(err=>{

        console.error(err);

    });

}

// =====================================================
// EXPORT CSV
// =====================================================

function exportCSV(){

    if(scans.length === 0){

        alert(
            "Aucune donnée à exporter"
        );

        return;

    }

    let csv =
        "Code Barre,Produit,Quantité,Dernier Scan\n";

    scans.forEach(scan=>{

        csv += `"${scan.code}","${scan.name}","${scan.quantity}","${scan.lastScan}"\n`;

    });

    const blob =
        new Blob(
            [csv],
            {type:"text/csv"}
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = "inventaire.csv";
    a.click();

    URL.revokeObjectURL(url);

}

// =====================================================
// RESET
// =====================================================

function clearData(){

    if(
        confirm(
            "Supprimer toutes les données ?"
        )
    ){

        scans = [];

        localStorage.removeItem(
            "barcode_scans"
        );

        renderTable();

        showMessage(
            "Données supprimées",
            "red"
        );

    }

}

</script>

</body>
</html>
